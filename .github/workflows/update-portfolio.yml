name: 更新投資儀表板

on:
  schedule:
    # UTC；台北 08:37、09:07，以及15:17–21:47每半小時。
    - cron: '37 0 * * 1-5'
    - cron: '7 1 * * 1-5'
    - cron: '17,47 7-13 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/**'
      - '.github/workflows/update-portfolio.yml'

concurrency:
  group: portfolio-dashboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      stale: ${{ steps.audit.outputs.stale }}
    permissions:
      contents: write
    steps:
      - name: 取得網站原始碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 更新市場資料
        run: |
          for attempt in 1 2 3; do
            node scripts/update-market-data.mjs
            if node scripts/quote-freshness.mjs --retry; then break; else
              if [ "$attempt" -lt 3 ]; then sleep 90; fi
            fi
          done
        env:
          GOOGLE_SHEET_SYNC_URL: ${{ secrets.GOOGLE_SHEET_SYNC_URL }}
          GOOGLE_SHEET_SYNC_TOKEN: ${{ secrets.GOOGLE_SHEET_SYNC_TOKEN }}

      - name: 逐檔報價日期與觸發紀錄
        id: audit
        run: node scripts/quote-freshness.mjs
        env:
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}

      - name: 檢查同步與行情日期判讀
        run: node --test scripts/*.test.mjs

      - name: 驗證儀表板
        run: node scripts/validate-dashboard.mjs

      - name: 保存更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: update portfolio market data"
            git push
          fi

      - name: 準備 GitHub Pages 檔案
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上傳 GitHub Pages 檔案
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 發布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


      - name: 過期行情告警
        if: needs.update.outputs.stale == 'true'
        run: |
          echo "::error::行情尚未到齊或盤後未取得今日報價；已保留各檔實際日期，請檢查 update summary。休市日請核對交易所公告。"
          exit 1
