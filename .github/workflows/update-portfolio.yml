name: 更新投資儀表板

on:
  schedule:
    # UTC；台北平日 17:17 主更新、18:47 條件式補跑。
    - cron: '17 9 * * 1-5'
    - cron: '47 10 * * 1-5'
    # 台北週二至週六 10:47，補抓海外基金前一估值日淨值。
    - cron: '47 2 * * 2-6'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/**'
      - '.github/workflows/update-portfolio.yml'

concurrency:
  group: portfolio-dashboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      stale: ${{ steps.audit.outputs.stale }}
      skip: ${{ steps.backup.outputs.skip }}
    permissions:
      contents: write
    steps:
      - name: 取得網站原始碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 檢查是否需要盤後補跑
        id: backup
        if: github.event_name == 'schedule' && github.event.schedule == '47 10 * * 1-5'
        run: |
          node --input-type=module <<'NODE'
          import {appendFile, readFile} from 'node:fs/promises';
          import {quoteFreshness} from './scripts/quote-freshness.mjs';

          const snapshot = html => JSON.parse(html.match(/const portfolioDataStatus=([^;]+);/)[1]);
          let skip = false;
          try {
            const saved = snapshot(await readFile('index.html', 'utf8'));
            const url = new URL('https://reg1900.github.io/2026-investment-portfolio-review/');
            url.searchParams.set('_backup_check', process.env.GITHUB_RUN_ID);
            const response = await fetch(url, {cache: 'no-store', signal: AbortSignal.timeout(12000)});
            if (!response.ok) throw new Error(`Pages HTTP ${response.status}`);
            const published = snapshot(await response.text());
            const audit = quoteFreshness(published.holdings);
            const today = audit.checkedAt.slice(0, 10);
            const expected = saved.holdings.filter(holding => holding.unit === '股');
            skip = published.syncedAt === saved.syncedAt
              && published.syncedAt >= `${today} 17:17`
              && published.syncedAt <= audit.checkedAt
              && expected.length > 0
              && audit.rows.length === expected.length
              && expected.every(holding => audit.rows.some(row => row.code === holding.n && row.date === today));
          } catch (error) {
            console.warn(`無法驗證網站已發布完整資料，繼續補跑：${error.message}`);
          }
          const message = skip ? '網站已發布今日完整台灣 ETF 收盤，略過補跑。' : '網站尚未確認今日完整收盤，執行補跑。';
          console.log(message);
          await appendFile(process.env.GITHUB_OUTPUT, `skip=${skip}\n`);
          await appendFile(process.env.GITHUB_STEP_SUMMARY, `\n${message}\n`);
          NODE

      - name: 更新市場資料
        if: steps.backup.outputs.skip != 'true'
        run: |
          for attempt in 1 2 3; do
            node scripts/update-market-data.mjs
            if node scripts/quote-freshness.mjs --retry; then break; else
              if [ "$attempt" -lt 3 ]; then sleep 90; fi
            fi
          done
        env:
          GOOGLE_SHEET_SYNC_URL: ${{ secrets.GOOGLE_SHEET_SYNC_URL }}
          GOOGLE_SHEET_SYNC_TOKEN: ${{ secrets.GOOGLE_SHEET_SYNC_TOKEN }}

      - name: 逐檔報價日期與觸發紀錄
        id: audit
        if: steps.backup.outputs.skip != 'true'
        run: node scripts/quote-freshness.mjs
        env:
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}

      - name: 檢查同步與行情日期判讀
        if: steps.backup.outputs.skip != 'true'
        run: node --test scripts/*.test.mjs

      - name: 驗證儀表板
        if: steps.backup.outputs.skip != 'true'
        run: node scripts/validate-dashboard.mjs

      - name: 保存更新
        if: steps.backup.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore: update portfolio market data"
            git push
          fi

      - name: 準備 GitHub Pages 檔案
        if: steps.backup.outputs.skip != 'true'
        run: |
          mkdir -p _site
          cp index.html _site/index.html

      - name: 設定 GitHub Pages
        if: steps.backup.outputs.skip != 'true'
        uses: actions/configure-pages@v5

      - name: 上傳 GitHub Pages 檔案
        if: steps.backup.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    if: needs.update.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 發布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


      - name: 過期行情告警
        if: needs.update.outputs.stale == 'true'
        run: |
          echo "::error::行情尚未到齊或盤後未取得今日報價；已保留各檔實際日期，請檢查 update summary。休市日請核對交易所公告。"
          exit 1
